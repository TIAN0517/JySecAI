name: "mitm6"
command: "python3"
args:
  - "-c"
  - |
    import shlex
    import subprocess
    import sys

    duration = 30.0
    if len(sys.argv) > 1 and sys.argv[1]:
        try:
            duration = float(sys.argv[1])
        except ValueError:
            sys.stderr.write("duration 参数必须为数字（秒）\n")
            sys.exit(1)

    domain = sys.argv[2] if len(sys.argv) > 2 else ""
    iface = sys.argv[3] if len(sys.argv) > 3 else ""
    extra = sys.argv[4] if len(sys.argv) > 4 else ""

    cmd = ["mitm6"]
    if domain:
        cmd.extend(["-d", domain])
    if iface:
        cmd.extend(["-i", iface])
    if extra:
        cmd.extend(shlex.split(extra))

    proc = subprocess.Popen(cmd, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
    try:
        output, _ = proc.communicate(timeout=duration)
    except subprocess.TimeoutExpired:
        proc.terminate()
        output, _ = proc.communicate()

    if output:
        sys.stdout.write(output)
    sys.exit(0)
enabled: true
short_description: "mitm6 DHCPv6/DNS 劫持工具，劫持 IPv6 流量配合 NTLM relay"
description: |
  mitm6 通过 DHCPv6 + DNS 劫持接管内网 IPv6 名称解析，通常配合 ntlmrelayx 做 LDAP/ADCS 中继（见 `active-directory-attack`）。

  **仅限授权范围内使用**：仅用于已获书面授权（SOW）的内网环境，中毒窗口须受控。

  **主要功能：**
  - 伪造 DHCPv6 服务分配 IPv6 地址与 DNS 服务器
  - 应答指定域名的 IPv6 解析，把目标流量引向攻击机
  - 产出 relay 所需的认证流量（HTTP/NTLM）

  **使用场景：**
  - 现代内网（默认双栈）首选的 NTLM relay 打点，比 LLMNR 投毒更隐蔽
  - WPAD 重放与 LDAP 中继链前置

  **注意事项：**
  - 本包装为非交互模式：运行 duration 秒后自动终止并回传期间捕获的协商记录，避免长期驻留
  - 需 root 与内网网卡；`-d` 限定目标域，避免全网络无差别中毒
  - 产生的认证流量直接喂给 ntlmrelayx；结束后确认无残留 IPv6 配置污染（台账留痕）
parameters:
  - name: "duration"
    type: "int"
    description: |
      运行时长（秒，可选，默认 30）。
      到时自动终止进程并输出已捕获内容，用于受控窗口投毒。
    required: false
    position: 0
    format: "positional"
    default: 30
  - name: "domain"
    type: "string"
    description: |
      要劫持解析的目标域（可选），映射为 `-d`。
      示例：corp.local
    required: false
    position: 1
    format: "positional"
  - name: "interface"
    type: "string"
    description: |
      监听网卡名（可选），映射为 `-i`。
      示例：eth0
    required: false
    position: 2
    format: "positional"
  - name: "additional_args"
    type: "string"
    description: |
      额外的 mitm6 参数（追加在命令末尾，按空格解析）。
      示例：`--no-ra --no-da`（只做 DHCPv6 DNS 中毒，降噪）
    required: false
    position: 3
    format: "positional"
