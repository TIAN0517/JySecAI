name: "certipy"
command: "python3"
args:
  - "-c"
  - |
    import shlex
    import subprocess
    import sys

    if len(sys.argv) < 2:
        sys.stderr.write("缺少certipy子命令\n")
        sys.exit(1)

    subcommand = sys.argv[1]
    target = sys.argv[2] if len(sys.argv) > 2 else ""
    extra = sys.argv[3] if len(sys.argv) > 3 else ""

    cmd = ["certipy", subcommand]
    if target:
        cmd.extend(["-target", target])
    if extra:
        cmd.extend(shlex.split(extra))

    proc = subprocess.run(cmd, capture_output=True, text=True)
    if proc.stdout:
        sys.stdout.write(proc.stdout)
    if proc.stderr:
        sys.stderr.write(proc.stderr)
    sys.exit(proc.returncode)
enabled: true
short_description: "Certipy AD CS 攻击工具（枚举/申请/伪造证书，ESC1-ESC8）"
description: |
  Certipy 用于 Active Directory 证书服务（AD CS）评估与攻击，配合 `active-directory-attack` Skill 使用。

  **仅限授权范围内使用**：仅用于已获书面授权（SOW）的目标域环境。

  **主要功能：**
  - find：枚举 CA 与证书模板，自动标记 ESC1-ESC8 错误配置
  - account：创建/操作机器账户
  - auth：用 .pfx 证书换取 Kerberos 票据与 NTLM hash
  - cert / forge：申请与伪造证书
  - relay：ESC8 中继（配合 ntlmrelayx）
  - shadow：Shadow Credentials 影子凭据攻击（GenericWrite 即可，不改密码不留痕）

  **使用场景：**
  - ADCS 错误配置枚举（`certipy find -vulnerable`）
  - ESC1/ESC8 等证书攻击链打点
  - 影子凭据持久化验证（结果记入改动台账）

  **注意事项：**
  - 需要域凭据与域网络可达
  - find 输出 Certipy.json、auth/shadow 产出 .pfx 等私钥文件：均含敏感材料，记入台账并在取证结束后清理
  - 非交互包装：认证参数经 additional_args 传入（如 `-u user@corp.local -p 'Passw0rd'`）
parameters:
  - name: "subcommand"
    type: "string"
    description: |
      certipy 子命令（必需）。
      常用值：find / account / auth / cert / forge / relay / shadow / parse
    required: true
    position: 0
    format: "positional"
  - name: "target"
    type: "string"
    description: |
      目标域控或 CA 主机（可选），映射为 `-target`。
      示例：dc01.corp.local
    required: false
    position: 1
    format: "positional"
  - name: "additional_args"
    type: "string"
    description: |
      额外的 certipy 参数（追加在命令末尾，按空格解析并保留引号内内容）。
      示例：`-u user@corp.local -p 'Passw0rd!' -vulnerable`
    required: false
    position: 2
    format: "positional"
