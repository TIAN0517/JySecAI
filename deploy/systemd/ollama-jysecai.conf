[Service]
# Serve both the Windows-hosted JySecAI/Hermes clients and Kali GPT in WSL.
Environment="OLLAMA_HOST=0.0.0.0:11434"
# Hermes agents need a large enough window for their tool schemas and history.
Environment="OLLAMA_CONTEXT_LENGTH=65536"
# Load on first request, then release model RAM after two idle minutes.
Environment="OLLAMA_KEEP_ALIVE=2m"
# This host has no usable GPU; keep CPU/RAM contention bounded.
Environment="OLLAMA_MAX_LOADED_MODELS=1"
Environment="OLLAMA_NUM_PARALLEL=1"
