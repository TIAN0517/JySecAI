map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
upstream jysec_core {
    server core:6688;
    keepalive 32;
}

upstream jysec_control_plane {
    server control-plane:8787;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 100m;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","product":"JySecAI","gateway":"ready"}\n';
    }

    location = /governance {
        return 308 /governance/;
    }

    # The governance UI is mounted below /governance while its APIs and
    # static assets retain stable absolute paths.
    location /governance/ {
        proxy_pass http://jysec_control_plane/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        proxy_pass http://jysec_control_plane;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v1/ {
        proxy_pass http://jysec_control_plane;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location = /metrics {
        proxy_pass http://jysec_control_plane;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Worker callbacks use the private service address and must not be exposed
    # through the public gateway.
    location /internal/ {
        return 404;
    }

    # Full JySecAI-derived operations console, including WebSocket/SSE.
    location / {
        proxy_pass http://jysec_core;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
