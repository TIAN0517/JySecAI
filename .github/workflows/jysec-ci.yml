name: JySecAI CI

on:
  workflow_dispatch:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: jysec-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
        working-directory: platform
      - run: npm run check
        working-directory: platform
      - run: npm audit --audit-level=high
        working-directory: platform
      - run: npm run build
        working-directory: platform
      - run: node --check public/app.js
        working-directory: platform

  upstream-console:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node --test web/static/js/*.test.cjs
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: true
      - run: go test ./...

  container-images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [control-plane, worker]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: platform
          target: ${{ matrix.target }}
          push: false
          tags: jysecai/${{ matrix.target }}:ci
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  core-container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.core
          target: core
          push: false
          tags: jysecai/core:ci
          cache-from: type=gha,scope=core
          cache-to: type=gha,mode=max,scope=core

  compose-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: cp platform/production.env.example platform/.env.production
      - name: Generate self-signed SSL certificates for testing
        run: mkdir -p deploy/ssl && openssl req -x509 -newkey rsa:2048 -keyout deploy/ssl/jysecai.key -out deploy/ssl/jysecai.crt -days 365 -nodes -subj "/CN=localhost"
      - run: docker compose -f compose.jysec.yml config --quiet
      - run: >-
          docker run --rm
          --add-host core:127.0.0.1
          --add-host control-plane:127.0.0.1
          -v "$PWD/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro"
          -v "$PWD/deploy/ssl:/etc/nginx/ssl:ro"
          nginx:1.29-alpine nginx -t

