<body ng-controller="loginController" ng-init="loginInit();" onLoad="document.forms.form_login.j_username.focus();">
<div class="container-fluid">

  <div class="login-top">
    <div class="system-title">活動訊息</div>
  </div>

  <div class="login-flex-area">

    <div class="login-flex-item qrcode-area hide-in-phone">
      <p class="login-fn-title">
        方式１：QRCode 登入
      </p>

      <div class="text-center">
        <!--正港 QR 扣 先隱藏-->
        <form class="form" action="../j_spring_security_check_qrcode" method="post" id="qrcodeForm" name="form_qrcode">
          <div ng-class="{'hidden':timeout===true}">
            <img class="qrcode-image" data-ng-src="data:image/png;base64,{{imageItem.img}}"/>
            <p class="qrcode-app-link">
              掃QRCode請用：
              <a class="link-color" href="https://tcit.tzuchi.net/Manual/loginapp/login.html" target="_blank"
                tabindex="-1">慈濟系統登入工具</a>
            </p>
          </div>
          <input type="text" hidden id="j_qrusername" name="j_qrusername">
        </form>
        <!--重設用 QR 扣-->
        <div ng-class="{'hidden':timeout===false}">
          <img class="change-qr-image" ng-click="qrcodeInit()">
          <p class="warning">請點箭頭圖示，更新 QRCode</p>
        </div>
      </div>


    </div>

    <div class="login-flex-item">
      <p class="login-fn-title">
        <span class="hide-in-phone">方式２：</span>帳號密碼登入
      </p>
      <form class="form" action="../j_spring_security_check" method="post" id="loginForm" name="form_login">

        <div class="loginInput">
          <input type="text" name="j_username" placeholder="帳號（例如: tzl00123）" id="j_username" ng-keypress="searchKeyPress($event);" ng-model="username" required>
          <p ng-show="form_login.j_username.$dirty && form_login.j_username.$error.required"><span class="oopsHelp">請記得填寫</span></p>          
        </div>

        <div class="loginInput">
          <input type="password" name="j_password" placeholder="密碼" id="j_password" ng-keypress="searchKeyPress($event);" ng-model="password" required>
          <p ng-show="form_login.j_password.$dirty && form_login.j_password.$error.required"><span class="oopsHelp">請記得填寫</span></p>          
        </div>

        <a id="loginBtn" ng-click="mysubmit();">登入</a>

      </form>
    </div>

  </div>
