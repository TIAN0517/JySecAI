<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>首頁後台｜慈濟入口網</title>
  <style>
    :root {
      --ink:#1B2D58; --accent:#5DC5C4; --text:#3C4453; --muted:#5C6575;
      --surface:#fff; --line:#E4E8EF; --bar-h:60px; --ease:cubic-bezier(.22,.61,.36,1);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { font-family: 'Noto Sans TC', sans-serif; color: var(--text); background: #F2F2F2; }

    .topbar {
      position: fixed; inset: 0 0 auto 0; height: var(--bar-h); z-index: 100;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 0 clamp(16px, 4vw, 32px); background: var(--ink); color: #fff;
      box-shadow: 0 2px 12px rgba(16,28,54,.18);
    }
    .brand { display: inline-flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; }
    .brand .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
    .logout {
      font-family: inherit; font-size: 15px; font-weight: 600; color: #EAF6F6;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.22); border-radius: 10px;
      min-height: 40px; padding: 0 16px; cursor: pointer; transition: background .15s var(--ease);
    }
    .logout:hover { background: rgba(255,255,255,.2); }
    .logout:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(255,255,255,.55); }

    .wrap { max-width: 1060px; margin: 0 auto; padding: calc(var(--bar-h) + 34px) clamp(16px, 4vw, 32px) 80px; }
    .hello h1 { color: var(--ink); font-size: 30px; margin: 0 0 6px; letter-spacing: -.01em; }
    .hello p { color: var(--muted); font-size: 16px; margin: 0 0 26px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
    a.tile {
      display: flex; flex-direction: column; gap: 8px; text-decoration: none;
      background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px 24px;
      box-shadow: 0 1px 2px rgba(16,28,54,.05), 0 1px 3px rgba(16,28,54,.07);
      transition: transform .18s var(--ease), box-shadow .18s var(--ease), border-color .18s var(--ease);
    }
    a.tile:hover { transform: translateY(-3px); border-color: #CBD5E6; box-shadow: 0 12px 28px rgba(16,28,54,.12); }
    a.tile:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(93,197,196,.5); }
    .tile__top { display: flex; align-items: center; justify-content: space-between; }
    .tile__title { color: var(--ink); font-size: 19px; font-weight: 700; }
    .tile__arrow { color: var(--accent); font-size: 20px; transition: transform .18s var(--ease); }
    a.tile:hover .tile__arrow { transform: translateX(3px); }
    .tile__desc { color: var(--muted); font-size: 15px; line-height: 1.55; }

    @media (prefers-reduced-motion: reduce) {
      a.tile, .tile__arrow { transition: none; } a.tile:hover { transform: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <span class="brand"><span class="dot"></span>首頁後台</span>
    <button class="logout" id="logout">登出</button>
  </header>
  <div class="wrap">
    <div class="hello">
      <h1>內容管理</h1>
      <p>選擇要編輯的首頁區塊;變更會即時反映在正式首頁。</p>
    </div>
    <div class="grid">
      <a class="tile" href="/dashboard/banner">
        <div class="tile__top"><span class="tile__title">Banner</span><span class="tile__arrow">→</span></div>
        <span class="tile__desc">標語、SROI、數據面板</span></a>
      <a class="tile" href="/dashboard/marquee">
        <div class="tile__top"><span class="tile__title">跑馬燈</span><span class="tile__arrow">→</span></div>
        <span class="tile__desc">首頁頂部的捲動公告</span></a>
      <a class="tile" href="/dashboard/alert">
        <div class="tile__top"><span class="tile__title">緊急公告</span><span class="tile__arrow">→</span></div>
        <span class="tile__desc">首頁頂部的緊急公告橫幅（單則）</span></a>
      <a class="tile" href="/dashboard/hero-quicklinks">
        <div class="tile__top"><span class="tile__title">快速連結</span><span class="tile__arrow">→</span></div>
        <span class="tile__desc">Hero 區的快速入口連結</span></a>
      <a class="tile" href="/dashboard/hero-cards">
        <div class="tile__top"><span class="tile__title">Hero 卡片</span><span class="tile__arrow">→</span></div>
        <span class="tile__desc">首頁主視覺的特色卡片</span></a>
      <a class="tile" href="/dashboard/projects">
        <div class="tile__top"><span class="tile__title">近期專案</span><span class="tile__arrow">→</span></div>
        <span class="tile__desc">近期專案與活動卡片</span></a>
      <a class="tile" href="/dashboard/knowledge">
        <div class="tile__top"><span class="tile__title">圖解知識包</span><span class="tile__arrow">→</span></div>
        <span class="tile__desc">知識包與其投影片</span></a>
      <a class="tile" href="/dashboard/map-locations">
        <div class="tile__top"><span class="tile__title">全球據點</span><span class="tile__arrow">→</span></div>
        <span class="tile__desc">世界地圖據點資料（名稱、地址、電話、座標）</span></a>
      <a class="tile" href="/dashboard/gongyi">
        <div class="tile__top"><span class="tile__title">公益勸募報告</span><span class="tile__arrow">→</span></div>
        <span class="tile__desc">收支報告自助上架（敘事 + Excel 式收支表）</span></a>
    </div>
  </div>
  <script type="module">
    import { captureTokenFromHash, requireAuth, logout } from '/tc-dashboard.js';
    captureTokenFromHash();
    requireAuth();
    document.getElementById('logout').addEventListener('click', logout);
  </script>

</html>
