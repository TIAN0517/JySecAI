<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SVG XSS Payload Verification</title>
<style>
body { font-family: sans-serif; padding: 20px; background: #f4f4f4; }
.frame { background: white; padding: 10px; margin: 10px 0; border: 1px solid #ddd; }
.xss-fired { background: #ffeb3b; padding: 5px; font-family: monospace; white-space: pre-wrap; }
#log { background: #000; color: #0f0; padding: 10px; font-family: monospace; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>SVG XSS Payload 跨域加载验证</h1>
<p>目标 SVG（自包含 XSS payload，不依赖服务器端函数）：
<a href="http://127.0.0.1:18080/svg_payload.svg" target="_blank">http://127.0.0.1:18080/svg_payload.svg</a></p>

<h2>1) <code>&lt;img src&gt;</code>（应忽略 JS）</h2>
<div class="frame">
  <img id="img-test" src="http://127.0.0.1:18080/svg_payload.svg" width="300">
</div>

<h2>2) <code>&lt;embed&gt;</code>（应执行 SVG JS）</h2>
<div class="frame">
  <embed id="embed-test" src="http://127.0.0.1:18080/svg_payload.svg" type="image/svg+xml" width="400" height="200">
</div>

<h2>3) <code>&lt;iframe&gt;</code>（应执行 SVG JS）</h2>
<div class="frame">
  <iframe id="iframe-test" src="http://127.0.0.1:18080/svg_payload.svg" width="400" height="200"></iframe>
</div>

<h2>捕获结果</h2>
<div id="result"></div>
<h2>日志</h2>
<div id="log">[waiting...]</div>

<script>
window.__xssLog = [];
window.__xssEvents = [];
const logEl = document.getElementById('log');
const resultEl = document.getElementById('result');
function log(msg) {
  const line = `[${new Date().toISOString()}] ${msg}\n`;
  window.__xssLog.push(line);
  logEl.textContent = window.__xssLog.join('');
  console.log(msg);
}

// 监听 SVG 通过 postMessage 发来的 XSS_FIRED 通知
window.addEventListener('message', (e) => {
  const ev = { type: e.data?.type, origin: e.origin, data: e.data, time: Date.now() };
  window.__xssEvents.push(ev);
  log(`>>> MESSAGE from ${e.origin}: ${JSON.stringify(e.data)}`);
  resultEl.innerHTML += `<div class="xss-fired">✓ XSS_FIRED from ${e.origin}:<br>${JSON.stringify(e.data, null, 2)}</div>`;
});

// 加载状态
const img = document.getElementById('img-test');
img.addEventListener('load', () => log(`img loaded (${img.naturalWidth}x${img.naturalHeight})`));
img.addEventListener('error', () => log('img load error'));

const embed = document.getElementById('embed-test');
embed.addEventListener('load', () => log('embed loaded'));
embed.addEventListener('error', () => log('embed load error'));

const iframe = document.getElementById('iframe-test');
iframe.addEventListener('load', () => log('iframe loaded'));
iframe.addEventListener('error', () => log('iframe load error'));

// 全局错误
window.addEventListener('error', (e) => {
  log(`✗ ERROR: ${e.message} @ ${e.filename}:${e.lineno}:${e.colno}`);
});

// 4 秒汇总
setTimeout(() => {
  log('--- 4s summary ---');
  log(`收到的 XSS_FIRED 事件数: ${window.__xssEvents.length}`);
  if (window.__xssEvents.length > 0) {
    resultEl.innerHTML += `<div class="xss-fired" style="background:#4caf50;color:white"><strong>✓ 跨域 SVG XSS 完整执行链验证通过</strong><br>事件数: ${window.__xssEvents.length}</div>`;
  } else {
    resultEl.innerHTML += `<div class="xss-fired" style="background:#f44;color:white">✗ 未捕获到 XSS 事件（--dump-dom 模式限制，真实浏览器会触发）</div>`;
  }
}, 4000);
</script>
</body>
</html>
