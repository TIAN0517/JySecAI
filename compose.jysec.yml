name: jysecai

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: ./platform/.env.production
    environment:
      POSTGRES_DB: jysec
      POSTGRES_USER: jysec
    volumes:
      - jysec-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jysec -d jysec"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    env_file: ./platform/.env.production
    command: ["sh", "-ec", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - jysec-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  core:
    build:
      context: .
      dockerfile: Dockerfile.core
      target: core
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - jysec-core-config:/app/config
      - jysec-core-data:/app/data
      - jysec-core-tmp:/app/tmp
      - jysec-core-workspace:/app/workspace
      - jysec-core-uploads:/app/chat_uploads
      - jysec-core-tools:/app/tools
      - jysec-core-agents:/app/agents
      - jysec-core-roles:/app/roles
      - jysec-core-skills:/app/skills
      - jysec-core-knowledge:/app/knowledge_base
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s

  control-plane:
    build:
      context: ./platform
      target: control-plane
    restart: unless-stopped
    env_file: ./platform/.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      core:
        condition: service_healthy
    expose:
      - "8787"
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true

  gateway:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      core:
        condition: service_healthy
      control-plane:
        condition: service_healthy
    ports:
      - "127.0.0.1:8787:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m,noexec,nosuid,nodev
      - /var/run:size=4m,noexec,nosuid,nodev
      - /tmp:size=16m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz | grep -q '\"status\":\"ok\"'"]
      interval: 20s
      timeout: 5s
      retries: 5

  worker:
    profiles: ["worker"]
    build:
      context: ./platform
      target: worker
      args:
        STRIX_VERSION: "1.5.3"
    restart: unless-stopped
    env_file: ./platform/.env.production
    depends_on:
      control-plane:
        condition: service_healthy
    volumes:
      - jysec-runs:/var/lib/jysec/runs
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    group_add:
      - "${DOCKER_GID:-998}"
    security_opt:
      - no-new-privileges:true

volumes:
  jysec-postgres:
  jysec-redis:
  jysec-runs:
  jysec-core-config:
  jysec-core-data:
  jysec-core-tmp:
  jysec-core-workspace:
  jysec-core-uploads:
  jysec-core-tools:
  jysec-core-agents:
  jysec-core-roles:
  jysec-core-skills:
  jysec-core-knowledge:
