        function getAllMsgNum() {
        $.ajax({
            headers: {
                'X-CSRF-TOKEN': "wOoi4sS4FE4WC0PuYATktGc3BxX1VYloejH3pyKj"
            },
            "method": "post",
            "url": "https://ofa77.shop/module/admin/unionshop/index/getAllMsgNum",
            "data": {},
            "dataType": 'json',
            "success": function (res) {
                if (res.status == 200) {
                    // layer.closeAll();

                    $('.h-allGoodsNum-num').html(res.data.allGoodsNum <= 99 ? res.data.allGoodsNum : '99+');
                    $('.h-allGoodsLowStatusNum-num').html(res.data.allGoodsLowStatusNum <= 99 ? res.data.allGoodsLowStatusNum : '99+');

                    if (res.data.allGoodsNum > 0) $('.h-allGoodsNum-num').removeClass('hide');
                    if (res.data.allGoodsLowStatusNum > 0) $('.h-allGoodsLowStatusNum-num').removeClass('hide');
                } else {
                    layer.msg(res.msg, {icon: 5})
                }
            },
            "error": function (res) {
                console.log(res);
            }
        });
    }

    //30秒获取要处理的数量
    setInterval(function () {
        getAllMsgNum();
    }, 10 * 1000);
    getAllMsgNum();
    </script>
