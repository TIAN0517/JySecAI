    <script>
        $(document).ready(function () {

                playAnnouncement();
            }
        });

        document.getElementById("captcha").onclick = function () {
            getNewCaptcha(this)
        };

        function getNewCaptcha(obj) {
            obj.src = '/SSO2_Develop/SSO20102/VerificationCode?' + new Date().getTime();
        }

        $(function () {
            if (messageTitle && message) {
                showAlert(messageTitle, message);
            }
        })

        //彈跳視窗訊息
        function showAlert(title, themessage) {
            if (title && themessage) {
                $('#messageModalCenterTitle').html(title)
                $('#alertMessage').html(themessage)
                $("#messageModalCenter").addClass('show');
            }
        }
