        <div id="content">
            <p class="text-center fw-bolder fs-5 mb-1">
                密碼變更
            </p>
            <div class="text-caption mb-2">
                若您忘記密碼，請勾選下列任一認證方式完成身分確認程序，完成驗證後，將引導您設定新密碼。
            </div>

            <ul class="btnRadios">
                <li>
                    <button class="btn">
                        <div class="icon">
                            <i class="fa-solid fa-envelope"></i>
                        </div>
                        <div class="text">
                            <p>電子郵件</p>
                            <span>透過註冊時設定的電子郵件信箱接收重設密碼連結。</span>
                        </div>
                    </button>
                </li>
                <li>
                    <button class="btn">
                        <div class="icon">
                            <i class="fa-solid fa-id-card"></i>
                        </div>
                        <div class="text">
                            <p>自然人憑證</p>
                            <span>插入自然人憑證並完成驗證，即可安全重設密碼。</span>
                        </div>
                    </button>
                </li>
                <li>
                    <button class="btn">
                        <div class="icon">
                            <i class="fa-solid fa-fingerprint"></i>
                        </div>
                        <div class="text">
                            <p>行動自然人憑證</p>
                            <span>使用手機的行動自然人憑證 App 進行身分驗證並重設密碼。</span>
                        </div>
                    </button>
                </li>
            </ul>

            <div class="d-grid gap-2 mt-3">
                <button class="btn btn-primary disabled JQ_nextStep" type="button">下一步</button>
            </div>
            <div class="text-center">
                <button class="btn" type="button" onclick="window.history.back();">返回</button>
            </div>
        </div>
    </div>

<script>
	$.ajaxSetup({ cache: false });
	var oaks_zta_proxy_path = '';
	$.ajaxPrefilter(function(options, originalOptions, jqXHR) {
		if (/^https?:\/\//i.test(options.url)) {
			return;
		}
		// 避免重複加 /proxy/
		if (oaks_zta_proxy_path != '' && options.url.indexOf(oaks_zta_proxy_path+'/') !== 0) {
			if (options.url.charAt(0) !== '/') {
				options.url = '/' + options.url;
			}
			options.url = oaks_zta_proxy_path + options.url;
		}
	});
</script>    <script type='text/javascript' src="/html/oaks_plugins/bootstrap5/bootstrap.bundle.min.js"></script>

    <script>
    $('.btnRadios .btn').off().on('click', function () {
        // 如果已經有 active，則取消
        if ($(this).hasClass('active')) {
            $(this).removeClass('active');
        } else {
            // 先移除其他的 active，再加到自己
            $('.btnRadios .btn').removeClass('active');
            $(this).addClass('active');
        }

        // 控制「下一步」按鈕的 disabled 狀態
        if ($('.btnRadios .btn.active').length > 0) {
            $('.btn.JQ_nextStep').removeClass('disabled');
        } else {
            $('.btn.JQ_nextStep').addClass('disabled');
        }
    });

    // 處理下一步按鈕點擊
    $('.btn.JQ_nextStep').off().on('click', function () {
        if ($(this).hasClass('disabled')) return;

        var selectedText = $('.btnRadios .btn.active .text p').text().trim();
        if (selectedText === '電子郵件') {
            changeModule('/forget_password_new.php?action=userinput&type=email');
        } else if (selectedText === '行動電話號碼') {
            changeModule('/forget_password_new.php?action=userinput&type=mobile');
        } else if (selectedText === '自然人憑證') {
            changeModule('/forget_password_new.php?action=moica_cert');
        } else if (selectedText === '行動自然人憑證') {
            changeModule('/forget_password_new.php?action=fido');
        }
    });
    </script>
</body>
