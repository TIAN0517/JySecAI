
<!DOCTYPE html>

<body class="hold-transition login-page">

    


<!-- particles.js container -->
<div id="particles-js"></div>

<div class="login-box">
    <div class="login-logo">
        <span><b class="text-nowrap">智慧桃園</b><span class="small text-nowrap">管理系統</span></span>
    </div>
    <div class="card">
        <!-- /.login-logo -->
        <form id="loginForm" method="post" action="/Admin/Login" autocomplete="off">
            <input name="__RequestVerificationToken" type="hidden" value="_U0fZu7Awc4nrmiKiABIqbgwJYMVWTGr1Ey45gsIuhfiMHirxBiQnpdRZKSnv3Ibhy_ArQXSY8Qj-1n-krMAJgvPNNVLgegNXplbVMo-Te01" />
            <div class="card-body login-card-body">
                <p class="login-box-msg">系統登入</p>

                <div class="input-group mb-3">
                    <input id="loginid" name="loginid" type="text" class="form-control required" placeholder="帳號" data-val="true" data-val-regex="請輸入帳號" maxlength="20" data-placement="left" autocomplete="off" required />
                    <div class="input-group-append">
                        <div class="input-group-text">
                            <span class="fas fa-user"></span>
                        </div>
                    </div>
                </div>
                <div class="input-group mb-3">
                    <input id="loginpwd" name="loginpwd" type="password" class="form-control required" placeholder="密碼" maxlength="20" data-placement="left" required />
                    <div class="input-group-append">
                        <div class="input-group-text">
                            <span id="viewpassword" class="fas fa-eye-slash"></span>
                        </div>
                    </div>
                </div>

                        <div class="row mb-3">
                            <div class="col-md-8">
                                <div class="form-group has-feedback">
                                    <input id="vericode" name="vericode" type="text" class="form-control required" placeholder="驗證碼" maxlength="5" data-placement="left" autocomplete="off" />
                                    <span class="glyphicon glyphicon-lock form-control-feedback"></span>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <img src="/Admin/Login/VerificationCode" class="img-responsive" alt="VerificationCode" />
                            </div>
                        </div>



                <div class="row">
                    <div class="col-md-8">
                        <button id="btn_submit" class="btn btn-primary btn-block btn-flat">系統登入</button>
                    </div>
                    <div class="col-md-4 pt-2 pt-lg-0 pt-md-0">
                        <a href="/Admin/Login/ForgotPassword" rel="nofollow noreferrer" class="btn btn-secondary btn-block btn-flat">忘記密碼</a>
                    </div>
                </div>
            </div>
            <!-- /.login-box-body -->
        </form>
    </div>

</div>
<!-- /.login-box -->
