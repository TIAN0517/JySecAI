## 🔧 数据类型定义

### 基础数据类型
```yaml
# 引用对象
reference:
  type: string                # 类型 (url/paper/advisory/tool)
  title: string               # 标题
  url: string                 # URL链接
  description: string         # 描述
  verified: boolean           # 是否已验证

# 字段定义
field:
  name: string               # 字段名
  type: string               # 数据类型
  required: boolean          # 是否必需
  description: string         # 字段描述
  validation: object          # 验证规则

# 分类统计
category:
  name: string               # 分类名称
  count: integer             # 数量
  percentage: float           # 百分比

# 评估指标
metric:
  name: string               # 指标名称
  value: any                 # 指标值
  unit: string               # 单位
  description: string         # 描述
```

---

## ✅ 验证规则

### 必需字段验证
- `metadata.id`: 必需，唯一标识符
- `metadata.name`: 必需，名称
- `metadata.category`: 必需，分类
- `metadata.created_at`: 必需，创建时间

### 数据类型验证
- `datetime`: ISO 8601格式 (YYYY-MM-DDTHH:MM:SSZ)
- `severity`: 枚举值 (critical/high/medium/low/info)
- `status`: 枚举值 (active/deprecated/experimental)
- `version`: 语义化版本 (x.y.z)

### 引用完整性验证
- `references`: URL格式验证
- `source`: 有效URL或文件路径
- `cve_id`: CVE格式验证 (CVE-YYYY-NNNN)

