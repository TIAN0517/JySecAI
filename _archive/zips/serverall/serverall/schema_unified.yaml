## 🔄 迁移指南

### 从现有格式迁移到统一格式

#### 1. 漏洞文件迁移
```yaml
# 原格式 (vuln/CVE-2024-0455.yaml)
info:
  name: anythingllm
  cve: CVE-2024-0455
  summary: 漏洞摘要
  # ...

# 统一格式
metadata:
  id: "cve-2024-0455"
  name: "AnythingLLM CVE-2024-0455"
  category: "vulnerability"
  severity: "critical"
  # ...

vulnerability:
  cve_id: "CVE-2024-0455"
  description: "漏洞摘要"
  # ...
```

#### 2. 指纹文件迁移
```yaml
# 原格式 (fingerprints/chuanhugpt.yaml)
info:
  name: Chuanhugpt
  author: 腾讯朱雀实验室
  # ...

# 统一格式
metadata:
  id: "fingerprint-chuanhugpt"
  name: "Chuanhugpt Fingerprint"
  category: "fingerprint"
  # ...

fingerprint:
  product:
    name: "Chuanhugpt"
    vendor: "Chuanhugpt"
  # ...
```

#### 3. MCP模块迁移
```yaml
# 原格式 (mcp/cmd_injection.yaml)
info:
  id: cmd_injection
  name: Command Injection Detection
  # ...

# 统一格式
metadata:
  id: "mcp-cmd-injection"
  name: "Command Injection Detection Module"
  category: "mcp_module"
  # ...

mcp_module:
  module:
    id: "cmd_injection"
    name: "Command Injection Detection"
    # ...
```

