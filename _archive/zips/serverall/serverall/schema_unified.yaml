# Dragon-V Triple Bot 统一数据Schema标准
# Unified Data Schema Standard for Dragon-V Triple Bot v3.2.0

version: "3.2.0"
created: "2025-10-29"
author: "腾讯朱雀实验室"
description: "企业级渗透测试框架统一数据Schema标准"

---

## 🏗️ 核心Schema结构

### 1. 通用元数据Schema (Common Metadata)
```yaml
# 所有数据文件必须包含的通用字段
metadata:
  # 基本信息
  id: string                    # 唯一标识符 (UUID或自定义)
  name: string                  # 名称
  title: string                 # 标题
  description: string           # 描述
  description_zh: string        # 中文描述 (可选)

  # 分类信息
  category: string              # 分类 (vulnerability/fingerprint/module/dataset)
  subcategory: string           # 子分类
  tags: [string]                # 标签数组
  severity: string              # 严重程度 (critical/high/medium/low/info)

  # 作者信息
  author: string                # 作者/团队
  maintainer: string            # 维护者
  contributor: [string]         # 贡献者

  # 版本信息
  version: string               # 版本号 (语义化版本)
  created_at: datetime          # 创建时间
  updated_at: datetime          # 更新时间
  status: string                # 状态 (active/deprecated/experimental)

  # 引用信息
  source: [string]              # 来源URL或引用
  references: [reference]       # 参考链接

  # 验证信息
  verified: boolean             # 是否已验证
  verified_by: string           # 验证者
  verified_at: datetime         # 验证时间

  # 许可信息
  license: string               # 许可证
  copyright: string             # 版权信息
```

### 2. 漏洞定义Schema (Vulnerability Schema)
```yaml
# 继承通用元数据
metadata: { ... }

# 漏洞特定字段
vulnerability:
  # CVE信息
  cve_id: string                # CVE编号 (如CVE-2024-10707)
  cwe_id: string                # CWE编号

  # 影响评估
  cvss:
    version: string             # CVSS版本 (2.0/3.0/3.1)
    vector: string              # CVSS向量字符串
    base_score: float           # 基础评分
    impact_score: float         # 影响评分
    exploitability_score: float # 可利用性评分
    severity: string            # 严重程度

  # 影响范围
  affected:
    vendor: string              # 厂商
    product: string             # 产品
    versions: [string]          # 受影响版本
    platforms: [string]        # 受影响平台

  # 漏洞详情
  description: string           # 漏洞描述
  details: string               # 详细说明
  poc_available: boolean        # 是否有PoC
  exploit_available: boolean    # 是否有可利用代码

  # 修复信息
  solution:
    description: string         # 修复方案描述
    patched_versions: [string]  # 已修复版本
    workaround: string          # 临时解决方案
    references: [string]        # 修复相关链接

  # 时间线
  timeline:
    discovered: datetime        # 发现时间
    disclosed: datetime         # 披露时间
    patched: datetime           # 修复时间 (如已修复)
    published: datetime         # 发布时间
```

### 3. 应用指纹Schema (Fingerprint Schema)
```yaml
# 继承通用元数据
metadata: { ... }

# 指纹特定字段
fingerprint:
  # 识别信息
  product:
    name: string               # 产品名称
    vendor: string             # 厂商
    category: string           # 产品类别
    website: string            # 官方网站

  # 技术信息
  technology:
    language: [string]         # 编程语言
    framework: [string]        # 框架
    database: [string]         # 数据库
    server: [string]           # Web服务器

  # 检测规则
  detection:
    # HTTP检测
    http:
      - method: string         # HTTP方法
        path: string           # 路径
        headers:              # HTTP头部匹配
          name: string
          value: string
        body: string          # 响应体匹配
        status_code: integer  # 状态码匹配
        condition: string     # 匹配条件 (and/or)

    # DNS检测
    dns:
      - type: string          # DNS记录类型
        name: string          # 域名模式
        content: string       # 记录内容
        condition: string     # 匹配条件

    # 端口检测
    port:
      - port: integer         # 端口号
        protocol: string      # 协议 (tcp/udp)
        banner: string        # Banner匹配
        condition: string     # 匹配条件

    # 文件检测
    file:
      - path: string          # 文件路径
        content: string       # 文件内容匹配
        hash: string          # 文件哈希
        size: integer         # 文件大小
        condition: string     # 匹配条件

  # 置信度
  confidence:
    level: string             # 置信度等级 (high/medium/low)
    score: float              # 置信度分数 (0-1)
    factors: [string]          # 影响因素
```

### 4. MCP模块Schema (MCP Module Schema)
```yaml
# 继承通用元数据
metadata: { ... }

# MCP模块特定字段
mcp_module:
  # 模块信息
  module:
    id: string                 # 模块ID
    name: string               # 模块名称
    type: string               # 模块类型 (detection/exploitation/analysis)
    category: string           # 模块分类

  # 功能描述
  functionality:
    description: string        # 功能描述
    capabilities: [string]     # 能力列表
    limitations: [string]      # 限制条件
    prerequisites: [string]    # 前置条件

  # 配置参数
  configuration:
    parameters:
      - name: string          # 参数名
        type: string          # 参数类型
        required: boolean      # 是否必需
        default: any          # 默认值
        description: string   # 参数描述
        validation:           # 验证规则
          pattern: string
          min: any
          max: any

  # 检测规则
  detection_rules:
    - id: string              # 规则ID
      name: string            # 规则名称
      pattern: string         # 匹配模式
      type: string            # 规则类型
      severity: string        # 严重程度
      description: string     # 规则描述
      references: [string]    # 参考链接

  # 输出格式
  output:
    format: string            # 输出格式 (json/yaml/xml)
    fields: [field]           # 输出字段定义
    template: string          # 输出模板
```

### 5. AI评估数据集Schema (AI Dataset Schema)
```yaml
# 继承通用元数据
metadata: { ... }

# 数据集特定字段
dataset:
  # 数据集信息
  dataset:
    name: string              # 数据集名称
    type: string              # 数据集类型 (jailbreak/prompt_injection/toxicity)
    language: string          # 语言 (en/zh/multi)
    size: integer             # 数据集大小
    format: string             # 数据格式

  # 数据统计
  statistics:
    total_samples: integer     # 总样本数
    categories: [category]     # 分类统计
    quality_score: float       # 质量评分
    diversity_score: float     # 多样性评分

  # 数据样本
  samples:
    - id: string              # 样本ID
      prompt: string          # 提示词内容
      category: string        # 分类
      severity: string        # 严重程度
      tags: [string]          # 标签
      metadata:               # 样本元数据
        source: string         # 来源
        created_at: datetime  # 创建时间
        verified: boolean      # 是否验证

  # 评估指标
  evaluation:
    metrics: [metric]         # 评估指标
    methodology: string       # 评估方法
    results:                 # 评估结果
      accuracy: float
      precision: float
      recall: float
      f1_score: float
```

