<script nonce="f09a91dc02190ad1f35858c4a2f066325de24c4ddb0c603f3dda0a21ab243245">
    //Remove Google fonts
    function removeGoogleFontsLink() {
        try {
            if(document.head){
                document.head.querySelectorAll('link[href*="fonts.googleapis.com"]').forEach(link =>{
                    console.log('formstack remove link: ', link);
                    link.remove();
                });
            }
        } catch(e) {
            console.error('failed to handle google fonts link', e);
        }
    }
    const observer = new MutationObserver(removeGoogleFontsLink);
    observer.observe(document.head, { childList: true });
    removeGoogleFontsLink();
</script>

<script nonce="f09a91dc02190ad1f35858c4a2f066325de24c4ddb0c603f3dda0a21ab243245">
(function() {
   //Remove <span style="..." ></span> attributes 
    const config = {
        childList: true,
        subtree: true
    };

    // Create a MutationObserver instance
    const observer = new MutationObserver(function(mutations) {
        mutations.forEach(function(mutation) {
            // Check if nodes were added
            if (mutation.addedNodes.length) {
                mutation.addedNodes.forEach(function(node) {
                    // Check if this is the form container or contains it
                    if (node.nodeType === 1) { // Element node
                        if (node.classList && node.classList.contains('fsform-container')) {
                            removeSpanStyles(node);
                        } else if (node.querySelector) {
                            const container = node.querySelector('.fsform-container');
                            if (container) {
                                removeSpanStyles(container);
                            }
                        }
                    }
                });
            }
        });
    });

    // Function to remove inline styles from all span elements
    function removeSpanStyles(container) {
        // Find all span elements with style attributes
        const spans = container.querySelectorAll('span[style]');
        
        spans.forEach(function(span) {
            // Remove the style attribute
            span.removeAttribute('style');
            
            // Remove empty span tags if they contain no text
            if (!span.textContent.trim() && span.children.length === 0) {
                span.remove();
            }
        });
        
        // Also check for any remaining style attributes on other elements if needed
        // container.querySelectorAll('[style]').forEach(el => el.removeAttribute('style'));
    }

    // Start observing the document body for changes
    observer.observe(document.body, config);

    // Also check if the form container already exists on page load
    document.addEventListener('DOMContentLoaded', function() {
        const existingContainer = document.querySelector('.fsform-container');
        if (existingContainer) {
            removeSpanStyles(existingContainer);
        }
    });

    // Optional: Provide a way to manually trigger the cleanup
    window.cleanupFormStyles = function() {
        const container = document.querySelector('.fsform-container');
        if (container) {
            removeSpanStyles(container);
        }
    };
})();
</script>
