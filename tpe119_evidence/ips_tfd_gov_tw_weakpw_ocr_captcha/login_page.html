    <script type="text/javascript">
        document.addEventListener("DOMContentLoaded", function() {
            var s = document.getElementById("showPassword");
            s.onclick = function () {
                var x = document.getElementById("Txt_Pw");
                var icon = document.getElementById("iconPassword");
                if (x.type === "password") {
                    x.type = "text";
                    icon.classList.remove("fas", "fa-eye");
                    icon.classList.add("fas", "fa-eye-slash");
                } else {
                    x.type = "password";
                    icon.classList.remove("fas", "fa-eye-slash");
                    icon.classList.add("fas", "fa-eye");
                }
            }

            var b = document.getElementById("btn_Login");
            b.onclick = function (e) {
                e.target.value = "載入中...";
            }

            var c = document.getElementById("CodeRefresh");
            c.onclick = function () {
                var img = document.getElementById("imgCode");
                img.setAttribute('src', 'Common/VCode.ashx?t=' + new Date().valueOf());
            }

            document.getElementsByTagName('body')[0].addEventListener('click', function (e) {
                if (e.target.id === 'imgCode') {
                    e.target.setAttribute('src', 'Common/VCode.ashx?t=' + new Date().valueOf());
                }

            });
        });
    </script>
