<style>
body {
  padding-top: 10px;
  padding-bottom: 0px;
}
</style>
<div cg-busy="{promise:anyPageBusy,message:'Loading...'}">
  <!-- content -->
  <div id="body-alerts-tag"></div>
  <div class="container">
  	<div class="row">
  		<div class="col-md-2">
  		</div>
  		<div class="col-md-8">
		    <div class="panel panel-primary">
			  <div class="panel-heading">
			    <h3 class="panel-title">雙因子認證</h3>
			  </div>
			  <div class="panel-body">
				    <form>
				    	<div class="form-group">
						    <label for="account">輸入驗證碼</label>
						    <input class="form-control" id="account" placeholder="驗證碼" ng-model="data.userToken">
						</div>
						<div class="text-right">
							<button class="btn btn-primary" ng-click="login(data.userToken)">確定</button>
							<a class="btn btn-warning" href="/" >返回</a>
						</div>
				    </form>
			  </div>
			</div>

		</div>
	</div>
  </div>
</div>
