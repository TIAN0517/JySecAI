<div ng-include="'templates/menu/menuTop.html'"></div>
<div cg-busy="{promise:anyPageBusy,message:'Loading...'}">
  <!-- content -->
  <div id="body-alerts-tag"></div>
  <div class="container-fluid">
    <div class="row" permission permission-only="'AUTH_USER_ALL'">
      <div class="col-md-10" align="left">
        <form name="searchForm" class="form-inline">
          <!-- 搜尋條件 -->
          <label>角色名稱
            <select class="form-control"
              ng-options="item.id as item.name for item in ddlRoles"
              ng-model="search.RoleId" >
              <option value="">--- 請選擇 ---</option>
            </select>
          </label>
          <label>USER名稱
            <input type="text" class="form-control" size="10" ng-model="search.name" name="name" >
          </label>
          <label>USER帳號
            <input type="text" class="form-control" size="15" ng-model="search.account" name="account" >
          </label>
          <label>狀態
            <select class="form-control" ng-options="item.value as item.name for item in accountStatusList" ng-model="search.disabled">
            </select>
          </label>
          <button class="btn btn-success" ng-click="searchUser(search)">查詢</button>
          <button class="btn btn-default" ng-click="clear()">清空</button>
          <!-- 搜尋條件 -->
        </form>
      </div>
      <div class="col-md-2" align="right">
        <button type="button" class="btn btn-success" aria-label="Left Align" ng-click="showAddModal()">
                <span class="glyphicon glyphicon-plus" aria-hidden="true"></span>
            </button>&nbsp;&nbsp;
      </div>
    </div>

    <div class="row">
      <div class="col-md-12">
        <script type="text/ng-template" id="headerCheckbox.html">
          <input type="checkbox" ng-model="checkboxes.checked" class="select-all" value="" />
        </script>
        <table ng-table="tableParams" show-filter="false" class="table table-bordered table-striped">

          <tr ng-repeat="row in $data track by row.id" class="text-font-size-18-black" align="center">
            <td title="''">
              {{row.id}}
            </td>
            <td title="'USER名稱'">
              {{row.name}}
            </td>
            <td title="'USER帳號'">
              {{row.account}}
            </td>
            <td title="'USER角色'">
              {{row.Role.name}}
            </td>
            <td title="'此為本地帳號'">
              {{row.isLocal==true ? '是' : '否'}}
            </td>
            <td title="'外部系統帳號'">
              {{row.extAccount}}
            </td>
            <td title="'遵守密碼規則'">
              {{row.applyPasswordRules==true ? '是' : '否'}}
            </td>
            <td title="'密碼過期'">
              {{row.isPasswordExpired==true ? '是': '否'}}
            </td>
            <td title="'密碼可改'">
              {{row.isPasswordChangeable==true ? '是': '否'}}
            </td>
            <td title="'登入過期'">
              <button permission permission-only="'AUTH_RESET_LOGIN'" ng-if="row.isLoginExpired" class="btn btn-danger" ng-click="activateAccount(row.id)">
                是
              </button>
              <span permission permission-except="'AUTH_RESET_LOGIN'" ng-if="row.isLoginExpired">是</span>
              <span ng-if="row.isLoginExpired==false" >否</span>
            </td>
            <td title="'雙因子'">
              {{row.use2FA==true ? '有': '無'}}
              <span permission permission-only="'AUTH_2FA'">
                <button ng-if="currentAccount==row.account && row.use2FA==false" class="btn btn-info" ng-click="request2FA(row)">啟用</button>
                <button ng-if="row.use2FA" class="btn btn-danger" ng-click="revoke2FA(row)">關閉</button>
              </span>
            </td>
            <td title="''">
              <button class="btn btn-default" ng-click="showEditModal($index)">
                <span class="glyphicon glyphicon-pencil" aria-hidden="true"></span>
              </button>
              <button permission permission-only="'AUTH_DEL_USER'" class="btn btn-danger" ng-click="showDelModal($index)" ng-if="!row.disabled">
                <span class="glyphicon glyphicon-trash" aria-hidden="true"></span>
              </button>
              <button permission permission-only="'AUTH_RESET_LOGIN'" class="btn btn-danger" ng-click="enableAccount(row.id)" ng-if="row.disabled">
                <span class="glyphicon glyphicon-repeat" aria-hidden="true"></span>
              </button>
              <button permission permission-only="'AUTH_RESET_PASSWORD'" class="btn btn-warning" ng-click="showResetPasswordModal(row)">
                重設密碼
              </button>

            </td>
          </tr>
        </table>
      </div>
    </div>
  </div>
</div>
<div ng-include="'templates/menu/menuBottom.html'"></div>
