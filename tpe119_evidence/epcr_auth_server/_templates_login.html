<style>
body {
  padding-top: 0px;
  padding-bottom: 0px;
}
</style>
<div style="margin: auto; width: 1024px; height: 768px; background-repeat: no-repeat; background-image: url('images/login.jpg');">
  <table style="width: 100%; height: 100%;">
    <tbody><tr>
        <td style="width: 50px">
        </td>
        <td style="width: 340px">
            <form>
                <table style="width: 100%; height: 100%;">
                    <tbody><tr style="height:370px">
                        <td></td>
                    </tr>
                    <tr>
                        <td align="center">
                          <div class="input-group input-group-lg">
                            <span class="input-group-addon addon-inside bg-white font-primary">
                              <i class="glyphicon glyphicon-user"></i>
                            </span>
                            <input type="text" class="form-control" id="exampleInputEmail1" placeholder="輸入帳號" ng-model="credentials.username">
                          </div>
                            <!-- <input type="text" class="txtAccount" class="form-control" style="font-size:Large;height:24px;width:220px;"> -->
                        </td>
                    </tr>
                    <tr>
                        <td style="height: 5px">
                        </td>
                    </tr>
                    <tr>
                        <td align="center">
                          <div id="body-alerts-tag"></div>
                          <div class="input-group input-group-lg">
                            <span class="input-group-addon addon-inside bg-white font-primary">
                              <i class="glyphicon glyphicon-lock"></i>
                            </span>
                            <input type="password" class="form-control" id="exampleInputPassword1" placeholder="輸入密碼" ng-model="credentials.password">
                          </div>
                            <!-- <input name="txtPassword" type="password" id="txtPassword" class="txtPassword" style="font-size:Large;height:24px;width:220px;"> -->
                        </td>
                    </tr>
                    <tr ng-if="captchaEnabled">
                        <td align="center">
                          <div class="form-inline" style="padding-top: 5px;">

                              <img alt="更換一張" ng-src="{{captchaImg}}" ng-click="setCaptcha()"></img>
                              <input type="text" class="form-control" size="6" name="captcha" placeholder="圖形驗證碼" ng-model="credentials.captcha" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">

                          </div>
                        </td>
                    </tr>
                    <tr>
                        <td style="height: 15px">
                        </td>
                    </tr>
                    <tr>
                        <td align="center">
                          <button class="btn btn-default btn-lg" type="submit"
                            ng-click="login(credentials)">
                            登入
                          </button>
                          <a class="btn btn-default btn-lg" ui-sref="changepassword">
                            修改密碼
                          </a>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding-left:35px">
                            <span id="lblMsg" style="color:Yellow;font-size:Large;font-weight:bold;"></span>
                        </td>
                    </tr>
                    <tr>
                        <td style="height:210px">
                        </td>
                    </tr>
                </tbody></table>
            </form>
        </td>
        <td style="width: 634px" align="right" valign="bottom">
            <span id="labVersion" style="color:#384076;font-size:Small;font-weight:bold;">{{}}</span>
            &nbsp;
        </td>
    </tr>
    </tbody>
  </table>
</div>
