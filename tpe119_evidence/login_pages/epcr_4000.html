<html ng-app="EPCRServer">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EPCR</title>

  <link href="bower_components/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet" type="text/css" />

  <link href="stylesheets/style.css" rel="stylesheet" type="text/css" />
  <link href="stylesheets/inOpStatus.css" rel="stylesheet" type="text/css" />
  <script src="bower_components/jquery/dist/jquery.min.js"></script>

    <!--<script id="myScript" src="bower_components/ngmap/build/scripts/ng-map.min.js"></script>
-->
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        // 取得當前網址
        var currentUrl = window.location.href;
        console.log(currentUrl)
        // 檢查是否匹配 /A/#/ABC
        if (!currentUrl.includes('/caseDetailPrint')) {
          var existingScript = document.getElementById('myScript'); // 獲取指定的 script 標籤
          if(existingScript){
            existingScript.src = 'https://maps.google.com/maps/api/js?key=AIzaSyB-ZbIMj6Now6cnwor9QRwjx6zEnzdYvU4'; // 替換為新的 JavaScript 檔案 URL
            // 重新加載 script
            var newScript = document.createElement('script');
            newScript.src = existingScript.src; // 使用新的 src
            newScript.id = existingScript.id; // 保持 id
                // 設定 onload 事件
                newScript.onload = function() {
                    console.log('新腳本已加載完成！');
                };
            existingScript.parentNode.replaceChild(newScript, existingScript); // 替換舊的 script
          }else{
            // 動態創建 script 標籤
            var script = document.createElement('script');
            script.src = 'https://maps.google.com/maps/api/js?key=AIzaSyB-ZbIMj6Now6cnwor9QRwjx6zEnzdYvU4';  // 指定要加載的外部資源
            script.async = false;  // 非同步加
