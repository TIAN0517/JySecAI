  <script language="javascript">
      function checkSubmit() {
        if (this.acc.value.length === 0) {
          this.msg.innerHTML = '請輸入帳號';
          return false;
        }
        if (this.pw.value.length === 0) {

          return false;
        }

        this.DoType.value = 'Login';
      }
